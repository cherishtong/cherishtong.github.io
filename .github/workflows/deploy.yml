name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 复用官方 Astro Pages action：安装、构建、上传产物都在内部完成。
      # 项目在 apps/web，但依赖和 lockfile 在仓库根目录，所以 path 用 `.`，
      # 构建命令沿用根 package.json 的 build，产物指向 apps/web/dist。
      - name: Build and upload
        uses: withastro/action@v6
        with:
          path: .
          node-version: 24
          package-manager: pnpm@12
          out-dir: apps/web/dist
          cache-dir: apps/web/node_modules/.astro

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
